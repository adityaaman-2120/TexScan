<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>TexScan: affordable fabric inspection</title>
    <meta name="description" content="TexScan: affordable fabric inspection for small textile units." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint (dark is the default) so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem("texscan-ui") || "{}");
        var theme = (saved.state && saved.state.theme) || "dark";
        document.documentElement.classList.toggle("dark", theme !== "light");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
