<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>TexScan</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Cpath d='M8 12V8h4M20 8h4v4M24 20v4h-4M12 24H8v-4' fill='none' stroke='%2322d3ee' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M11 16h10' stroke='%2322d3ee' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint (dark is the default) so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem("texscan-ui") || "{}");
        var theme = (saved.state && saved.state.theme) || "dark";
        document.documentElement.classList.toggle("dark", theme !== "light");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
